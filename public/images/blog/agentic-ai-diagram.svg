<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#090d16"/>
  <text x="40" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Multi-Agent Autonomous Coordination Loop</text>
  
  <!-- Planner Agent -->
  <rect x="80" y="150" width="180" height="180" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="170" cy="200" r="30" fill="#0284c7" fill-opacity="0.3"/>
  <text x="170" y="250" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Planner Agent</text>
  <text x="170" y="275" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Decomposes Objectives</text>

  <!-- Execution Agents -->
  <rect x="340" y="130" width="160" height="100" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="170" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Code Agent</text>
  <text x="420" y="195" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Deterministic Execution</text>

  <rect x="340" y="250" width="160" height="100" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Research Agent</text>
  <text x="420" y="315" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">RAG &amp; Knowledge Fetch</text>

  <!-- Verifier Agent -->
  <rect x="570" y="150" width="180" height="180" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <circle cx="660" cy="200" r="30" fill="#9333ea" fill-opacity="0.3"/>
  <text x="660" y="250" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Verifier Agent</text>
  <text x="660" y="275" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Formal Proofs &amp; Unit Tests</text>

  <!-- Arrows -->
  <path d="M 260,200 L 330,170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 260,240 L 330,290" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 500,170 L 560,200" stroke="#10b981" stroke-width="2"/>
  <path d="M 500,290 L 560,240" stroke="#f59e0b" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="40" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">CHASSIS &amp; SAFETY FABRICATION</text>
  <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">6-Point FIA Roll Cage Geometry (DOM 1.75 x 0.095)</text>
  
  <!-- Roll cage wireframe isometric -->
  <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Hoop -->
    <path d="M 320,380 L 320,180 Q 320,150 350,150 L 450,150 Q 480,150 480,180 L 480,380" fill="none"/>
    <!-- Diagonal Bar -->
    <line x1="320" y1="180" x2="480" y2="380"/>
    <!-- Harness Bar -->
    <line x1="320" y1="280" x2="480" y2="280"/>
    <!-- Rear Stays -->
    <line x1="350" y1="150" x2="200" y2="360"/>
    <line x1="450" y1="150" x2="600" y2="360"/>
    <!-- A Pillar Bars -->
    <path d="M 350,150 L 520,200 L 540,400" fill="none" stroke="#eab308"/>
    <!-- Door X-bar -->
    <line x1="480" y1="360" x2="540" y2="240" stroke="#f59e0b" stroke-width="4"/>
    <line x1="480" y1="260" x2="540" y2="370" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <rect x="40" y="390" width="300" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="415" fill="#94a3b8" font-family="system-ui" font-size="11">MATERIAL &amp; STANDARD</text>
  <text x="60" y="440" fill="#f59e0b" font-family="system-ui" font-size="18" font-weight="700">FIA / SCCA Compliant DOM</text>
</svg>

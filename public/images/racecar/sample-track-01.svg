<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <text x="40" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">TELEMETRY &amp; GPS TRACK MAP</text>
  <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Turn 1 to Turn 11 Velocity Overlay</text>
  
  <!-- Track outline -->
  <path d="M 150,220 C 150,150 250,120 380,120 C 500,120 620,160 680,240 C 720,290 680,380 580,400 C 480,420 380,340 320,380 C 260,420 180,420 150,350 Z" 
        fill="none" stroke="url(#trackGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data metrics callout -->
  <rect x="520" y="60" width="240" height="120" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
  <text x="540" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PEAK VELOCITY</text>
  <text x="540" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">128.4 MPH</text>
  <text x="540" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">LATERAL ACCELERATION</text>
  <text x="540" y="165" fill="#22c55e" font-family="system-ui, sans-serif" font-size="18" font-weight="700">1.44 G</text>
</svg>

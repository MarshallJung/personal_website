<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0b0f19"/>
  <text x="40" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">AERODYNAMICS &amp; DOWNFORCE</text>
  <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Dual-Element Airfoil &amp; Splitter Pressure Distribution</text>
  
  <!-- Airfoil profile -->
  <path d="M 200,260 C 240,190 350,210 580,290 C 590,294 570,300 500,300 C 350,300 240,295 200,260 Z" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 520,305 C 550,275 620,290 680,350 C 685,355 660,355 600,345 Z" fill="#475569" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Flow lines -->
  <path d="M 80,180 C 240,170 380,190 720,260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6"/>
  <path d="M 80,240 C 220,240 380,280 720,380" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6"/>
  <path d="M 80,320 C 260,340 450,370 720,440" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6"/>

  <rect x="40" y="380" width="340" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">MEASURED L/D EFFICIENCY</text>
  <text x="60" y="438" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">4.15 : 1 Downforce to Drag</text>
</svg>

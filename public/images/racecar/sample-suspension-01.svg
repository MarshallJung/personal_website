<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="40" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">SUSPENSION &amp; CHASSIS DYNAMICS</text>
  <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">4-Wheel Corner Weight Scales (50.02% Cross)</text>
  
  <!-- Car top-down silhouette -->
  <rect x="280" y="140" width="240" height="300" rx="30" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Front Left -->
  <rect x="180" y="150" width="80" height="60" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
  <text x="195" y="175" fill="#94a3b8" font-family="system-ui" font-size="11">FL SCALE</text>
  <text x="195" y="198" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">652 lbs</text>

  <!-- Front Right -->
  <rect x="540" y="150" width="80" height="60" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
  <text x="555" y="175" fill="#94a3b8" font-family="system-ui" font-size="11">FR SCALE</text>
  <text x="555" y="198" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">648 lbs</text>

  <!-- Rear Left -->
  <rect x="180" y="360" width="80" height="60" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
  <text x="195" y="385" fill="#94a3b8" font-family="system-ui" font-size="11">RL SCALE</text>
  <text x="195" y="408" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">594 lbs</text>

  <!-- Rear Right -->
  <rect x="540" y="360" width="80" height="60" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
  <text x="555" y="385" fill="#94a3b8" font-family="system-ui" font-size="11">RR SCALE</text>
  <text x="555" y="408" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">591 lbs</text>

  <!-- Cross weight indicator -->
  <text x="400" y="295" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="18" font-weight="700">CROSS: 50.02%</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13">TOTAL: 2,485 LBS (w/ driver)</text>
</svg>
